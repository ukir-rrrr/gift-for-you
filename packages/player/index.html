<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>gift-for-you</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-screen="boot">
    <div id="rotate" hidden>たてむきにしてね</div>
    <div id="error" hidden>
      <p id="error-text" data-testid="error"></p>
    </div>
    <div id="stage">
      <div id="frame">
        <div id="overlay">
          <p id="section"></p>
          <div id="memory" data-testid="memory-popup" hidden>
            <div class="memory-frame">
              <img id="memory-photo" data-testid="memory-photo" alt="" />
              <img class="frame-art" src="/assets/fx/frame.png" alt="" />
            </div>
            <p id="memory-text"></p>
          </div>
          <button id="prompt" type="button" data-testid="prompt" hidden>タップして開ける</button>
          <div id="held" hidden>
            <img id="held-icon" alt="" />
            <p id="held-label"></p>
          </div>
          <div id="assist" data-testid="assist" hidden>
            <p>お助け</p>
            <button id="btn-invincible" type="button">むてき</button>
            <button id="btn-float" type="button">ふわふわ</button>
            <button id="btn-assist-easy" type="button">かんたん</button>
            <button id="btn-skip" type="button">この先へ</button>
            <button id="btn-decline" type="button">このまま</button>
          </div>
          <p id="watermark" hidden>gift-for-you</p>
        </div>
      </div>
      <div id="dock">
        <div id="tools">
          <button id="btn-diff" type="button" data-testid="difficulty">ふつう</button>
          <button id="btn-easy" type="button">かんたん</button>
          <button id="btn-walk" type="button">歩き 6</button>
          <button id="btn-mute" type="button">おと オン</button>
          <button id="btn-flash" type="button">てんめつ あり</button>
        </div>
        <div id="pad" data-testid="pad">
          <div class="pad-move">
            <div class="pad-btn" data-pad="left" data-testid="pad-left" role="button" aria-label="左">
              <svg viewBox="0 0 8 8" aria-hidden="true"><path d="M5 0h1v8H5zM4 1h1v6H4zM3 2h1v4H3zM2 3h1v2H2z"/></svg>
            </div>
            <div class="pad-btn" data-pad="right" data-testid="pad-right" role="button" aria-label="右">
              <svg viewBox="0 0 8 8" aria-hidden="true" class="flip"><path d="M5 0h1v8H5zM4 1h1v6H4zM3 2h1v4H3zM2 3h1v2H2z"/></svg>
            </div>
          </div>
          <div class="pad-btn pad-jump" data-pad="jump" data-testid="pad-jump" role="button" aria-label="ジャンプ">
            <svg viewBox="0 0 8 8" aria-hidden="true" class="up"><path d="M5 0h1v8H5zM4 1h1v6H4zM3 2h1v4H3zM2 3h1v2H2z"/></svg>
            <span>ジャンプ</span>
          </div>
        </div>
      </div>
    </div>
    <div id="title">
      <h1 id="title-text" data-testid="title"></h1>
      <button id="btn-start" type="button" disabled>よみこみ中</button>
    </div>
    <div id="letter" data-testid="letter" hidden>
      <div id="letter-body"></div>
      <button id="btn-retry" type="button" hidden>つながったら開く</button>
      <div id="egift" hidden>
        <button id="btn-egift" type="button">eギフトを受け取る</button>
        <p id="egift-code" data-testid="egift-code" hidden></p>
        <form id="unlock" data-testid="unlock" hidden>
          <label for="unlock-input">合言葉</label>
          <input id="unlock-input" type="text" autocomplete="off" autocapitalize="off" maxlength="32" />
          <button type="submit">ひらく</button>
          <p id="unlock-error" role="alert"></p>
        </form>
      </div>
    </div>
    <div id="confirm" hidden>
      <p id="confirm-domain"></p>
      <p id="confirm-warn" hidden></p>
      <p id="confirm-block" hidden></p>
      <a id="confirm-go" target="_blank" rel="noopener noreferrer">開く</a>
      <button id="confirm-cancel" type="button">やめる</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
